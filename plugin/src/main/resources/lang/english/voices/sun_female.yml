# Said to the player whose altar created the god without a gender word on the sign: the god chose its gender itself.
# <gender> is the name of the gender it chose ("God", "Goddess", "Deity")
believer-god-chose-gender:
- 'Rejoice in the light, <player>! I have chosen to be your <gender> of the Sun!'
# Said to all believers when a priest (or a plugin) changed the god's gender. <gender> is the new one ("God",
# "Goddess", "Deity")
believers-gender-changed:
- 'A new dawn rises, believers! From now on I am your <gender> of the Sun!'
# Said to all believers when the god descends to its main altar and appears there (it rose to the descended rank, config.yml ranks.descended)
believers-god-descended:
- 'Rejoice! I have descended in all my light! Come to my altar and bask in my glory!'
# Said to all believers when the god that had descended ascends again (no priest, or too few believers)
believers-god-ascended:
- 'The sun must set. I return to the sky, until your faith shines bright again.'
# Said to all believers when the god rises to a new rank (<rank>: its name, as the god type calls it; the descended rank has believers-god-descended)
believers-god-rank-up:
- 'Behold my light! Your faith has made me <hl><rank></hl>, and I shine brighter than ever.'
# Said to all believers when the god falls to a lower rank (<rank>: its new rank; falling below descended has believers-god-ascended)
believers-god-rank-down:
- 'Clouds gather over me. I am only <hl><rank></hl> now. Let your faith shine again.'
# Said to the priests when the main altar is gone and the god's oldest remaining altar becomes its main altar (<world>, <x>, <y>, <z>: its altar block)
priests-main-altar-moved:
- 'My main altar has fallen into shadow. The altar at <hl><x>, <y>, <z></hl> shall shine as our home now.'
# Said to the priests when the main altar is gone and the god has no altar left
priests-main-altar-lost:
- 'My last altar has fallen. Build me a new one in the light, priest.'
