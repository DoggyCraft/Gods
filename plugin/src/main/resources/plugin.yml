name: Gods
author: DogOnFire
version: ${project.version}
api-version: '1.21'
load: POSTWORLD
website: "http://dev.bukkit.org/server-mods/gods"
main: com.dogonfire.gods.Gods
softdepend:
  - WorldGuard
  - PlaceholderAPI
  - GriefPrevention
  - Citizens
  - FancyNpcs
commands:
  g:
    description: "Controls the god system"
    usage: /<command>
    aliases: [gods]
permissions:
  gods.*:
    children:
      gods.accept: true
      gods.admin: true
      gods.admin.info: true
      gods.admin.setrank: true
      gods.admin.devotion: true
      gods.admin.prayerpower: true
      gods.admin.mood: true
      gods.admin.gender: true
      gods.admin.godskin: true
      gods.admin.quest: true
      gods.admin.setaltar: true
      gods.altar.build: true
      gods.altar.pray: true
      gods.altar.sacrifice: true
      gods.attack: true
      gods.blessings: true
      gods.chat: true
      gods.check: true
      gods.devotion: true
      gods.commandments: true
      gods.curses: true
      gods.divorce: true
      gods.followers: true
      gods.god.create: true
      gods.help: true
      gods.holyartifact: true
      gods.holyland: true
      gods.home: true
      gods.hunt: true
      gods.info: true
      gods.itemblessings: true
      gods.leave: true
      gods.list: true
      gods.rank: true
      gods.listen: true
      gods.love: true
      gods.marriages: true
      gods.marry: true
      gods.pray: true
      gods.priest: true
      gods.priest.access: true
      gods.priest.alliance: true
      gods.priest.bible: true
      gods.priest.description: true
      gods.priest.editbible: true
      gods.priest.gender: true
      gods.priest.godskin: true
      gods.priest.invite: true
      gods.priest.kick: true
      gods.priest.pvp: true
      gods.priest.setaltar: true
      gods.priest.setbible: true
      gods.priest.startattack: true
      gods.priest.war: true
      gods.reject: true
      gods.reload: true
      gods.setpriest: true
      gods.setsafe: true
    default: false
    description: "Gives access to all Gods commands"
  gods.pray:
    default: true
    description: "Player can pray directly to their Gods using /g prayfor command"
  gods.listen:
    default: true
    description: "Player can hear Gods speaking"
  gods.marriages:
    default: true
    description: "Allows the Player to list married couples"
  gods.love:
    default: true
    description: "Allows the Player to love his partner"
  gods.marry:
    default: true
    description: "Allows the Player to marry"
  gods.divorce:
    default: true
    description: "Allows the Player to divorce"
  gods.accept:
    default: true
    description: "Allows the Player to accept a proposal from a God"
  gods.altar.build:
    default: true
    description: "Allows the Player to build an altar"
  gods.altar.pray:
    default: true
    description: "Allows the Player to pray at an altar"
  gods.altar.sacrifice:
    default: true
    description: "Allows the Player to sacrifice items using fire"
  gods.attack:
    default: true
    description: "Allows the Player to join the attack of their religion on an enemy Holy Land"
  gods.blessings:
    default: true
    description: "The Player can be blessed by a God"
  gods.chat:
    default: true
    description: "The Player use religion only chat"
  gods.check:
    default: true
    description: "Allows the Player to check religion for another player"
  gods.devotion:
    default: true
    description: "Allows the Player to see their devotion to their god, or a player's"
  gods.commandments:
    default: true
    description: "Allows the Player to receive commandments"
  gods.curses:
    default: true
    description: "The Player can be cursed by a God"
  gods.followers:
    default: true
    description: "The Player can see the list of followers of a God"
  gods.god.create:
    default: true
    description: "Allows the Player to create a new God"
  gods.help:
    default: true
    description: "Allows player to check the help page"
  gods.holyartifact:
    default: op
    description: "Allows the Player to get a Holy Artifact from their God with /g holyartifact"
  gods.holyland:
    default: true
    description: "The Player is affected by holyland"
  gods.home:
    default: true
    description: "The Player can teleport to the home of their religion, its main altar"
  gods.info:
    default: true
    description: "Allows the Player to see details for a god"
  gods.itemblessings:
    default: true
    description: "The Player can be blessed with items by a God"
  gods.leave:
    default: true
    description: "Allows the Player to leave their religion"
  gods.rank:
    default: true
    description: "Allows the Player to see the rank of a god, and what its next rank needs"
  gods.list:
    default: true
    description: "Allows the Player to see the list of gods"
  gods.hunt:
    default: true
    description: "Allows the Player to hunt during hunt quests"
  gods.priest:
    default: true
    description: "Allows the Player to become priest"
  gods.priest.access:
    default: true
    description: "Allows priest to change access type for their religion"
  gods.priest.invite:
    default: true
    description: "Allows priest to invite a player into his religion"
  gods.priest.alliance:
    default: true
    description: "Allows priest to declare alliance relations to another God"
  gods.priest.bible:
    default: true
    description: "Allows a priest to produce the Holy Book for his religion"
  gods.priest.description:
    default: true
    description: "Allows priest to change the description for a religion"
  gods.priest.editbible:
    default: true
    description: "Allows a priest to edit the Holy Book for his religion"
  gods.priest.gender:
    default: true
    description: "Allows a priest to change the gender of their God"
  gods.priest.godskin:
    default: true
    description: "Allows a priest to give the figure of their God at its main altar a player's skin"
  gods.priest.kick:
    default: true
    description: "Allows priest to kick believers from their religion"
  gods.priest.pvp:
    default: true
    description: "Allows priest to change the pvp setting for their religion"
  gods.priest.setaltar:
    default: true
    description: "Allows a priest to choose the main altar of their religion, its home (/g setaltar, /g sethome)"
  gods.priest.setbible:
    default: true
    description: "Allows a priest to set the Holy Book for his religion"
  gods.priest.startattack:
    default: true
    description: "Allows priest to start an attack on the Holy Land of an enemy religion"
  gods.priest.war:
    default: true
    description: "Allows priest to declare war relations to another God"
  gods.reject:
    default: true
    description: "Allows the Player to reject a proposal from a God"
  gods.reload:
    default: false
    description: "Allows the Player to reload configuration for the Gods system"
  gods.setpriest:
    default: false
    description: "Allows a player to set a priest for a religion"
  gods.setsafe:
    default: op
    description: "The Player can set safe or neutral lands"
  gods.admin:
    default: op
    description: "All /g admin actions; a single gods.admin.<action> is enough for that one action"
    children:
      gods.admin.info: true
      gods.admin.setrank: true
      gods.admin.devotion: true
      gods.admin.prayerpower: true
      gods.admin.mood: true
      gods.admin.gender: true
      gods.admin.godskin: true
      gods.admin.quest: true
      gods.admin.setaltar: true
  gods.admin.info:
    default: op
    description: "Allows /g admin info: a God's rank, stats, devotion, main altar, figure and quest"
  gods.admin.setrank:
    default: op
    description: "Allows /g admin setrank: give a God any rank"
  gods.admin.devotion:
    default: op
    description: "Allows /g admin devotion: set a believer's devotion level or points"
  gods.admin.prayerpower:
    default: op
    description: "Allows /g admin prayerpower: set a believer's prayer power"
  gods.admin.mood:
    default: op
    description: "Allows /g admin mood: change a God's mood"
  gods.admin.gender:
    default: op
    description: "Allows /g admin gender: change a God's gender without the cooldown"
  gods.admin.godskin:
    default: op
    description: "Allows /g admin godskin: give any God's figure a player's skin"
  gods.admin.quest:
    default: op
    description: "Allows /g admin quest: start, complete or fail a God's quest"
  gods.admin.setaltar:
    default: op
    description: "Allows /g admin setaltar: make the altar you look at a God's main altar"
