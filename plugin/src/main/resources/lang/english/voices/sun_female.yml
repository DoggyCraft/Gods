# The voice of sun goddesses: what the god says in each situation. The god says one of the lines of a key, picked
# at random. The text is MiniMessage (https://docs.advntr.dev/minimessage/format.html), shown after the god's name in
# white bold (god.speech in messages.yml). '' or [] makes the god say nothing.
# Tags: <player>, <type>, <amount> (what they are depends on the situation), <god> (the god's name), <server> (the
# server name); <hl>...</hl> is the gold highlight. A key missing here falls back to the bundled file of this voice.

