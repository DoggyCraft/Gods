# Sent to everyone on the server
broadcast:
  # When config.yml's gods.broadcast-new-gods is on. <player>, <god>, <gender> ("God", "Goddess", "Deity")
  new-god: <white><player><aqua> started to believe in the <gender> <gold><god>
  # When two players marry: <player>, <partner> (display names), <god>
  married: <white><player><aqua> just married <white><partner><aqua> in the name of <gold><god><aqua>!
  # When a believer completes a pilgrimage: <player> (display name) and the <type> of the place
  pilgrimage: <gold><player><aqua> completed a pilgrimage to <gold><type>
  # When a god rises to the greater rank: <god>, <rank> (its name, as the god type calls it), <gender> ("God", "Goddess", "Deity")
  greater-god: <gold><bold><god></bold><aqua> has risen to <gold><rank></gold>! Its religion is among the greatest in <server>.

# The /gods command. Each command has its parameters and description (shown by /gods help) and its replies.
command:
  # <usage> is the command name and its parameters
  usage: '<green>Usage: /gods <usage>'
  no-permission: <red>You do not have permission to perform this command.
  no-god: <red>You do not believe in a God.
  player-only: <red>This is a Player-Only command.
  priest-only: <red>This is a Priest-Only command.
  invalid: <red>Invalid Gods command!
  # Another plugin stopped what the command was about to do
  cancelled: <red>Another plugin stopped that.
  # Your god's rank hasn't unlocked that yet (config.yml's ranks.unlocks): <god>, <rank> (the rank it needs, as its god type calls it)
  rank-locked: <red><gold><god></gold> must rise to <hl><rank></hl> before its religion can do that.
  # /gods without a command
  gods:
    # <plugin> is "Gods vX.Y", <amount> the number of gods, <believers> the number of believers
    header:
    - <yellow>------------------ <plugin> ------------------
    - <aqua>By DogOnFire
    - ''
    - <aqua>There are currently <white><amount><aqua> Gods and
    - <white><believers><aqua> believers in <server>
    - ''
    believer: <white>You believe in <gold><god>
    priest: <white>You are the priest of <gold><god>
    prayer-power: <white>You have <gold><amount><white> prayer power
    no-god: <red>You do not believe in any god
    # <player> is the partner
    married: <white>You are married to <gold><player>
    separator:
    - ''
    footer: <green>For the full command list, please use <aqua>/gods help
  # <god> as typed
  no-such-god: <red>There is no God with the name <gold><god>
  not-married: <red>You are not married, bozo!
  disabled:
    holy-land: <red>Holy Land is not enabled on this server
    bibles: <red>Bibles are not enabled on this server
    marriage: <red>Marriage is not enabled on this server
    marriages: <red>Marriages are not enabled on this server
    holy-artifacts: <red>Holy Artifacts are not enabled on this server
    blessings: <red>Blessings are not enabled on this server
    prayers: <red>Prayers are not enabled on this server
    quests: <red>Quests are not enabled on this server
    npc: <red>God figures at altars are not enabled on this server
    devotion: <red>Devotion is not enabled on this server
  admin:
    parameters: \<action> ...
    description: Admin tools for gods and believers (/g admin lists them)
    header: '<yellow>Gods admin actions:'
    # One action: <action>, <parameters> and <description>
    line: '<aqua>/g admin <action> <parameters> <gray>- <description>'
    # <action> as typed
    unknown: <red><action> is not an admin action. /g admin lists them
    # <action>, and <parameters>: its parameters
    usage: '<green>Usage: /gods admin <action> <parameters>'
    # <god> as typed
    no-god: <red>There is no God called <gold><god>
    # <player> as typed
    no-player: <red>No believer called <hl><player></hl> is known
    # <player>
    not-believer: <red><player> does not believe in a God
    # <value> as typed
    not-a-number: <red><value> is not a number
    info:
      parameters: \<god>
      description: Show a God's rank, stats, devotion, main altar, figure and quest
      # Shown where a God has none (no main altar, no quest, no known type)
      none: none
      # <god>, <type> ("God of the Sun"), <rank> (its name for its rank) and <rank-key> (spirit ... greater),
      # <rank-since> and <descended> (times, or -), <npc> (yes/no: its figure stands at its main altar), <power>,
      # <mood> (-100 to 100) and <mood-name>, <amount> (believers), <devotion> (believers per devotion level),
      # <priests>, <prayers>, <sacrifices>, <quests>, <converts> (its lifetime stats), <main-altar> and <quest>
      lines:
      - '<yellow>--------- <gold><god></gold> (<type>) ---------'
      - '<aqua>Rank: <yellow><rank></yellow> (<rank-key>) since <yellow><rank-since></yellow>, descended: <yellow><descended></yellow>, figure: <yellow><npc>'
      - '<aqua>Power: <yellow><power></yellow>, mood: <yellow><mood></yellow> (<mood-name>)'
      - '<aqua>Believers: <yellow><amount></yellow> (<devotion>), priests: <yellow><priests>'
      - '<aqua>Stats: <yellow><prayers></yellow> prayers, <yellow><sacrifices></yellow> sacrifices, <yellow><quests></yellow> quests, <yellow><converts></yellow> converts'
      - '<aqua>Main altar: <yellow><main-altar></yellow>, quest: <yellow><quest>'
    setrank:
      parameters: \<god> \<rank>
      description: Give a God a rank, whatever its conditions (spirit, recognized, descended, exalted, greater or its type's names for them)
      # <rank> as typed
      unknown: <red><rank> is not a rank. Use spirit, recognized, descended, exalted or greater
      # <god>, <rank>
      already: <yellow><gold><god></gold> already is <rank>
      # <god>, <rank> (its name for the rank) and <rank-key>
      done: <aqua><gold><god></gold> is now <yellow><rank></yellow> (<rank-key>)
    devotion:
      parameters: \<player> \<level/+points/-points/points>
      description: Give a believer a devotion level, or add, take or set their devotion points
      # <value> as typed
      unknown: <red><value> is not a devotion level or a number. Use follower, devotee, zealot, saint or +/- points
      # <player>, <level> and <amount>: their devotion points now
      done: <aqua><gold><player></gold> is now <yellow><level></yellow> with <yellow><amount></yellow> devotion points
    prayerpower:
      parameters: \<player> \<+n/-n/n>
      description: Add, take or set a believer's prayer power
      # <player>, and <amount>: their prayer power now
      done: <aqua><gold><player></gold> now has <yellow><amount></yellow> prayer power
    mood:
      parameters: \<god> \<+n/-n/n/=-n>
      description: Change a God's mood (-100 to 100); +n and -n add and take, n and =-n set it
      # <god>, <mood> (-100 to 100) and <mood-name>
      done: <aqua>The mood of <gold><god></gold> is now <yellow><mood></yellow> (<mood-name>)
    gender:
      parameters: \<god> \<god/goddess/deity>
      description: Change a God's gender, without the priests' cooldown
      # <god>, and <gender> ("God", "Goddess", "Deity")
      already: <yellow><gold><god></gold> already is a <gender>
      # <god>, and <gender>. The god tells its believers itself (believers-gender-changed).
      done: <aqua>You made <gold><god></gold> a <yellow><gender>
    godskin:
      parameters: \<god> \<player/reset>
      description: Give any God's figure a player's skin, or its theme's again (the answers are command.godskin's)
    quest:
      parameters: \<god> \<start/complete/fail>
      description: Start a quest for a God, or complete or fail its quest (with rewards, words and events)
      # <god>
      not-started: <red><gold><god></gold> could not get a quest now (it has one, or none could be made)
      # <god>
      no-quest: <red><gold><god></gold> has no quest
      # <god>
      start: <aqua><gold><god></gold> has a new quest
      # <god>
      complete: <aqua>The quest of <gold><god></gold> is completed
      # <god>
      fail: <aqua>The quest of <gold><god></gold> has failed
    setaltar:
      parameters: \<god>
      description: Make the praying altar you look at a God's main altar (the other answers are command.setaltar's)
      no-altar: <red>Look at the sign, the block or the light of an altar, at most 5 blocks away
  access:
    parameters: '[open/close]'
    description: Set your religion as open or invite only
    not-priest: <red>Only priests can set religion access
    no-god: <red>That God does not exist
    opened:
    - <aqua>You set the religion access to <yellow>open</yellow>.
    - <aqua>Players can join religion by praying at altars.
    closed:
    - <aqua>You set the religion access to <red>closed</red>.
    - <aqua>Players can now only pray to this religion by invitation.
    invalid: <red>That is not a valid command
  ally:
    parameters: \<god>
    description: Toggle alliance with another religion
    not-priest: <red>Only priests can declare alliances
    own-god: <red>You cannot ally with your own God!
    at-war: <red>You are in WAR with <gold><god></gold>!
  attack:
    parameters: ''
    description: Join the attack of your religion on an enemy Holy Land
    no-attack: <red>Your religion is not attacking a Holy Land. Your priest can start an attack with <white>/gods startattack
    world-not-loaded: <red>The Holy Land your religion is attacking is in a world that is not loaded
    joined: <aqua>You joined the attack on the enemy Holy Land
    joined-god: <aqua>You joined the attack on the Holy Land of <gold><god>
  bible:
    parameters: ''
    description: Produce a copy of the Holy Book of your religion
    not-priest: <red>Only your priest can produce the Holy Book
    failed: <red>Could not produce a Holy Book for <god>
    # <title> of the holy book
    produced: <aqua>You produced a copy of <gold><title></gold>!
  chat:
    parameters: ''
    description: Chat only with believers within your religion
    public: <aqua>You are now chatting public
    religion: <aqua>You are now only chatting with the believers of <yellow><god>
  check:
    parameters: \<player>
    description: Show the religion of a player
    no-player: <red>There is no player online with that name
    no-god: <aqua><player> does not believe in a god
    priest: <aqua><player> is the Priest of <yellow><god>
    believer: <aqua><player> believes in <yellow><god>
  desc:
    parameters: \<text>
    description: Set the description of your religion
    not-priest: <red>Only priests can set religion info
    done: <aqua>You set your religion description to <yellow><description>
  devotion:
    parameters: '[player]'
    description: Show your devotion to your God, or a player's
    no-god: <red>You do not believe in any God.
    # <player> as typed: neither online nor a believer of your God
    no-player: <red>There is no believer called <hl><player></hl>
    not-believer: <aqua><player> does not believe in a god
    header: <yellow>--------- The devotion of <player> ---------
    # <level>: their devotion level, as their God's type calls it (themes.yml); <amount>: their devotion points
    level: '<aqua><player> is a <gold><level></gold> of <gold><god></gold> <gray>(<amount> devotion points)'
    # Only the believer themselves sees the rest. <level>: the next level; <needed>: the points still missing
    next: '<aqua>Next level: <gold><level></gold> <gray>(<needed> more points)'
    top: <aqua>You have the highest devotion there is.
    # <days>: days since their last prayer (config.yml devotion.fade-after-days and fade-percent-per-day)
    fading: <red>Your devotion fades, you have not prayed for <days> days. Pray at an altar before you lose your level!
    # The points each deed earns (config.yml devotion.points): <prayer>, <sacrifice>, <quest>, <convert>, <holy-food>,
    # <unholy-mob>
    earn:
    - '<aqua>Earn devotion points by:'
    - '<white> Praying at an altar <gray>+<prayer>'
    - '<white> Sacrificing what your God wants <gray>+<sacrifice>'
    - '<white> Taking part in a completed quest <gray>+<quest>'
    - '<white> Inviting a player who joins <gray>+<convert>'
    - '<white> Eating the holy food <gray>+<holy-food><white>, slaying the unholy creature <gray>+<unholy-mob>'
    unlocks-header: '<aqua>What devotion brings:'
    # One per unlock (config.yml devotion.unlocks): <unlock> (one of unlock.*) and <level> (the level it needs)
    met: '<green> ✔ <unlock> <gray>(<level>)'
    unmet: '<red> ✘ <unlock> <gray>(<level>)'
    unlock:
      # <percent>: config.yml devotion.prayfor-discount-percent
      prayfor-discount: /g prayfor costs <percent>% less
      holy-artifacts: Your God may give you a Holy Artifact
      # <times>: config.yml devotion.blessing-chance-multiplier
      more-blessings: Your God's gifts come <times> times as often
      praise: Your God praises you to the other believers
      title: Your devotion is your title
      priesthood: You are the first your God asks to be a priest
  divorce:
    parameters: ''
    description: Divorce your partner
    done: <aqua>You divorced <white><player>!
  editbible:
    parameters: ''
    description: Get an editable copy of the Holy Book of your religion
    not-priest: <red>Only your priest can edit your Holy Book
    failed: <red>Could not produce a editable bible for <god>
    hint: <aqua>After you have edited it, set this as your bible with <white>/g setbible</white>!
  followers:
    parameters: '[god]'
    description: Show the followers of your/a God
    none: <gold><god><aqua> has no believers!
    header: <yellow>--------- The Followers of <god> ---------
    # One per believer: <player> (padded to line up), <when> they last prayed (time.*-ago) and <devotion> (devotion, or
    # nothing while devotion is off)
    line: <yellow><player><aqua> Prayed <gold><when> <devotion>
    # The line of the player using the command
    you: <gold><player><aqua> Prayed <gold><when> <devotion>
    # Below the list, when the player isn't in it
    you-below: <gold><player> Prayed <when> <devotion>
    # Their devotion level, as the god type calls it (<level>)
    devotion: <gray>(<level>)
  gender:
    parameters: \<god|goddess|deity>
    description: Change the gender of your God
    # <word> is what the priest wrote. The words are altar.gender-words, and English God, Goddess and Deity.
    unknown: <red><word> is not a gender. Use God, Goddess or Deity
    # <god>, and <gender> ("God", "Goddess", "Deity")
    already: <red><god> is already your <gender>
    # <god>, and <hours>: how many hours until the gender may change again (config.yml:
    # priests.gender-change-cooldown-hours)
    cooldown: <red>The gender of <god> changed recently. Wait <hl><hours></hl> more hours
    # <god>, and <gender> ("God", "Goddess", "Deity"). The god tells its believers itself (believers-gender-changed).
    done: <aqua>You made <gold><god><aqua> your <yellow><gender>
  godskin:
    parameters: '[player/reset]'
    description: Give your God's figure at its main altar your skin, or a player's
    not-priest: <red>Only priests can choose the skin of your God
    # <player> as typed; sent while the skin is looked up
    looking: <gray>Looking for the skin of <player>...
    # <player> as typed
    not-found: <red>There is no player called <hl><player></hl> with a skin
    # <god>, and <player>: whose skin it wears now
    done: <aqua><gold><god></gold> now appears in the skin of <yellow><player>
    # <god>
    reset: <aqua><gold><god></gold> appears in the skin of its kind again
  help:
    parameters: '[page/altar/blocks]'
    description: Show the list of Gods commands
    # <plugin> is "Gods vX.Y", <page> this page of the commands and <pages> how many there are
    header:
    - <yellow>------------ <plugin> (page <page> of <pages>) ------------
    - <aqua>/gods<white> - Basic info
    # One per command: <usage> and <description>
    line: <aqua>/gods <usage><white> - <description>
    # Below every page but the last: <next> is the next page, <pages> how many there are
    next-page: <aqua>Use <white>/g help <next></white> for the next page (of <pages>)
    # <amount> is the page asked for, <pages> how many there are
    no-page: <red>There is no page <amount>; the last page is <pages>
    altar:
    - <yellow>--------------- How to build an Altar ---------------
    - '<aqua>Build an altar to your God by following these simple steps:'
    - ''
    - <white>  1 - Place a block (the block decides the type of God)
    - <white>  2 - Place a torch, lantern or candle on top
    - <white>  3 - Place a wall sign on the side of the block
    - <white>  4 - Write the name of your God on the sign, and <aqua>God<white>, <aqua>Goddess<white> or <aqua>Deity<white>
    - <white>      on another line to choose (or let your God choose)
    - ''
    - <aqua>You can now pray to your God by right-clicking the sign, the altar block or its light!
    - <aqua>Check what type of god you can make with <white>/g help blocks
    blocks-header:
    - <yellow>--------------- God Types ---------------
    - '<aqua>These are the block types you can use for making Gods:'
    - ''
    # One per god type that altars can make: <god_type> in the god type's color (<type_color>) and its <blocks>
    block-type: '<type_color><god_type><white>: <blocks>'
    blocks-footer:
    - ''
    - <aqua>Check how to build an altar with <white>/g help altar
  holyartifact:
    parameters: ''
    description: Let your God give you a Holy Artifact
    already: <red>You already carry a Holy Artifact
    world-disabled: <red>Gods are not present in this world
    # <god> has no type yet (no altar was ever built to it)
    failed: <red><god> has no holy artifact to give
    # The believer's devotion level is too low (config.yml devotion.unlocks.holy-artifacts); <level> is the level it
    # needs, as the god type calls it
    devotion-locked: <red><gold><god></gold> only trusts a <hl><level></hl> or more with a Holy Artifact. Serve your God, and /g devotion shows how far you are
    done: <gold><god><aqua> gave <player> a Holy artifact!
  home:
    parameters: ''
    description: Teleport to the home of your religion, its main altar
    # <god> is the believer's God
    none: <red><gold><god></gold> has no main altar to be its home. Build an altar to your God
    unsafe: <red>There is no safe place to stand at the main altar of <gold><god>
  hunt:
    parameters: ''
    description: Show how far you are from the quest target
    flying: <red>No flying allowed.
    no-target: <red>There is no quest target to hunt for, Mr. fancy pants!
  info:
    parameters: '[god]'
    description: Show info about your/a God
    no-god: <red>You do not believe in any God.
    unknown-god: <red>There is no God with such name.
    # <title> ("God of Thunder") in the color of the god type (<type_color>); empty when gods.titles is off
    header: <yellow>--------- <god> <type_color><title></type_color> ---------
    god-description: <dark_purple><italic><description>
    # <mood> is the name from names.mood
    mood:
      EXALTED: <gold><god> is <mood>
      PLEASED: <dark_green><god> is <mood>
      NEUTRAL: <white><god> is <mood>
      DISPLEASED: <gray><god> is <mood>
      ANGRY: <dark_red><god> is <mood>
    # <type> is the item the god wants sacrificed
    sacrifice: <gold><god><aqua> wants more <white><type>
    no-priest: '<aqua>Priest: <yellow>None'
    priest: '<aqua>Priest: <yellow><player>'
    priests: '<aqua>Priests: '
    priests-line: <yellow> - <player>
    # <rank>: the god's rank, as its god type calls it
    rank: '<aqua>Rank: <gold><rank>'
    # Its believers see its next rank (<rank>) and how far it is (<conditions>: each condition as next-rank-met or
    # next-rank-unmet, with <name> (names.rank-condition) and <value> (command.rank.value), joined by the separator)
    next-rank: '<aqua>Next rank: <gold><rank></gold> <conditions>'
    next-rank-met: '<green><name> <value>'
    next-rank-unmet: '<red><name> <value>'
    next-rank-separator: '<gray>, '
    # The believer's own devotion level (<level>, as the god type calls it) and points (<amount>)
    devotion: '<aqua>Your devotion: <gold><level></gold> <gray>(<amount> points)'
    believers: '<aqua>Believers: <yellow><amount>'
    power: '<aqua>Exact power: <yellow><power>'
    holy-food: '<aqua>Holy food: <yellow><type>'
    unholy-food: '<aqua>Unholy food: <yellow><type>'
    holy-creature: '<aqua>Holy creature: <yellow><type>'
    unholy-creature: '<aqua>Unholy creature: <yellow><type>'
    relations: '<aqua>Religious relations: '
    alliance: <green> Alliance with <gold><god>
    war: <red> War with <gold><god>
    holy-land: '<aqua>Holyland claimed: <gold><claimed>/<max>'
    # Only the God's believers see where its main altar is; <world>, <x>, <y>, <z> are its altar block
    main-altar: '<aqua>Main altar: <yellow><world> <x>, <y>, <z>'
    # Shown to its priests when the God has none
    no-main-altar: '<aqua>Main altar: <yellow>None <gray>(look at one of your altars and use /gods setaltar)'
  invite:
    parameters: \<player>
    description: Invite a player to your religion
    not-priest: <red>Only priests can invite players
    no-god: <red>You dont believe in a god
    no-player: <red>There is no player with the name '<yellow><player></yellow>' online.
    already: <yellow><player><red> already believes in '<gold><god></gold>!
    done: <aqua>You invited <yellow><player></yellow> to join <gold><god></gold>!
  kick:
    parameters: \<player>
    description: Kick a believer from your religion
    not-priest: <red>Only priests can kick believers from a religion
    no-believer: <red>There is no such believer called '<player>' in your religion
    yourself: <red>You cannot kick yourself from your own religion, Bozo!
    done: <aqua>You kicked <yellow><player></yellow> from your religion!
    # To the believer who was kicked
    kicked: <red>You were kicked from the religion of <yellow><god></yellow>!
  leave:
    parameters: ''
    description: Leave your religion
    done: <aqua>You left the religion of <yellow><god>
    no-god: <red>You are not part of any religion!
  list:
    parameters: ''
    description: List the Gods of this server
    none: <gold>There are no Gods in <server>!
    header: <yellow>--------- The Gods of <server> ---------
    # One per god: <rank> (its place in the list), <name> (the name and title, padded to line up), <power>, <believers>,
    # <god-rank> (the god's rank, as its god type calls it)
    line: <yellow><rank><aqua> - <name><gold> <god-rank> Power <power> Believers <believers>
    # The line of the player's god
    you: <gold><rank> - <name><gold> <god-rank> Power <power> Believers <believers>
    # Below the list, when the player's god isn't in it
    you-below: <gold><rank> - <name> <god-rank> Power <power> Believers <believers>
  love:
    parameters: ''
    description: Show your love to your partner
    offline: <white><player><red> is not online!
    done: <aqua>You love <white><player>!
  marriages:
    parameters: ''
    description: List the most loving married couples
    none: There are no married couples yet!
    header: <yellow>--------- The Married Couples in <server> ---------
    # <couple> below, padded to line up
    couple: <first> & <second> (<god>)
    # One per couple: <rank>, <couple>, <when> they last loved (time.*-ago)
    line: <white><rank> - <couple><aqua> Loved <gold><when>
    you: <gold><rank> - <couple><aqua> Loved <gold><when>
    # Below the list, when the player isn't in it
    you-below: <gold><rank> - <couple> Loved <when>
  marry:
    parameters: \<name>
    description: Ask another player to marry you
    no-player: <red>There is no player with the name '<white><player></white>' online.
    yourself: <red>Marry yourself!? Think again...
    no-god: <white><player><red> does not believe in a God
    other-god: <white><player><red> does not believe in <gold><god>
    # <partner>
    other-married: <white><player><red> is already married to <white><partner>!
    married: <red>You are already married to <white><partner>!
    proposed: <aqua>You proposed <white><player></white> to marry you in the name of <gold><god>!
  'no':
    parameters: ''
    description: Reject a proposal from your God
    # A player without a god and no invitation to answer
    nothing: <red>There is nothing to answer.
  prayfor:
    parameters: \<Item/Health/Blessing/Quest>
    description: Pray to your God for something specific
    help:
    - <yellow>--------------- How to pray for things ---------------
    - '<aqua>Pray for something specific from your God:'
    - ''
    - <white>/g prayfor item - <aqua> pray for an item
    - <white>/g prayfor health - <aqua> pray for health
    - <white>/g prayfor blessing - <aqua> pray for a magical blessing
    # The header of help when blessings are off (so there is no item, health or blessing to pray for)
    help-header:
    - <yellow>--------------- How to pray for things ---------------
    - '<aqua>Pray for something specific from your God:'
    - ''
    # Only when quests are on
    help-quest: <white>/g prayfor quest - <aqua> pray for a quest
    help-footer:
    - ''
    - <aqua>Note that you need prayer power to perform these prayers.
    healthy: <aqua>You are already in good health.
    has-quest: <gold><god><aqua> already has given a quest!
  pvp:
    parameters: ''
    description: Toggle PvP for your religion
    disabled: <aqua>You set PvP for your religion to <yellow> disabled
    enabled: <aqua>You set PvP for your religion to <yellow> enabled
  rank:
    parameters: '[god]'
    description: Show the rank of your/a God and what its next rank needs
    no-god: <red>You do not believe in any God.
    unknown-god: <red>There is no God with such name.
    header: <yellow>--------- The rank of <god> ---------
    # <rank>: the god's rank, as its god type calls it (themes.yml); <hours>: how long it has had it
    rank: '<aqua>Rank: <gold><rank></gold> <gray>(for <hours> hours)'
    # Only the god's believers (and the console) see the rest
    # <rank>: the next rank
    next: '<aqua>Next rank: <gold><rank></gold><aqua>. It needs:'
    top: <aqua><god> has the highest rank there is.
    # One per condition: <name> (names.rank-condition) and <value> (one of value.*)
    met: '<green> ✔ <name>: <value>'
    unmet: '<red> ✘ <name>: <value>'
    value:
      # <current>: where the god is, <required>: what the rank needs
      count: <current>/<required>
      hours: <current>/<required> hours
      # <current>: its mood now, <required>: the least it needs (names.mood)
      mood: <current> (at least <required>)
      'yes': 'yes'
      'no': 'no'
  reload:
    parameters: ''
    description: Reload the configuration and data files
    failed: <red>Could not reload; the old settings and data are kept. See the server log.
    # <plugin> is "Gods vX.Y"
    done: '<yellow><plugin>: <white>Reloaded configuration.'
  setaltar:
    parameters: ''
    description: Make the altar you look at the main altar and home of your religion (also /g sethome)
    not-priest: <red>Only priests can choose the main altar of your religion
    no-altar: <red>Look at the sign, the block or the light of an altar to your God, at most 5 blocks away
    not-praying: <red>That is not an altar to pray at
    # <god> is the priest's own God
    other-god: <red>That altar is not an altar of <gold><god>
    already: <yellow>That already is the main altar of <gold><god>
    # <world>, <x>, <y>, <z> are its altar block
    done: <aqua>The main altar of <gold><god></gold> is now at <yellow><world> <x>, <y>, <z>
  setbible:
    parameters: ''
    description: Set the book in your hand as the Holy Book of your religion
    not-priest: <red>Only your priest can set the Bible
    failed: <red>You cannot use that as the Bible for <gold><god>
    done: <aqua>You set <gold><title></gold> as your holy scripture!
  setpriest:
    parameters: \<god> \<player>
    description: Assign someone to be the priest
    no-god: <red>There is no god called '<gold><god><aqua>'
    no-player: <red>There is no such player online
    done: <aqua>You set <gold><player></gold> as priest of <gold><god>
    failed: <gold><player><red> was not assigned as a priest of <gold><god>
  setsafe:
    parameters: ''
    description: Set or clear neutral land at your location
    cleared: <aqua>You set cleared the neutral land in this location.
    set: <aqua>You set neutral land in this location.
  startattack:
    parameters: ''
    description: Start an attack on the enemy Holy Land you are standing in
    already: <red>You are already attacking a Holy Land!
    not-holy-land: <red>You must stand in the Holy Land of an enemy religion to attack it
    own-land: <red>You cannot attack your own Holy Land!
    not-at-war: <red>You are not in war with <gold><god></gold>!
    under-attack: <red>This Holy Land is already under attack!
    done: <aqua>You started an attack on the Holy Land of <gold><god>
  war:
    parameters: \<god>
    description: Toggle war with another religion
    own-god: <red>You cannot go to war with your own God!
    allied: <red>You are ALLIED with <gold><god></gold>!
  'yes':
    parameters: ''
    description: Accept a proposal from your God
    # A player without a god and no invitation to answer
    nothing: <red>There is nothing to answer.

# How long ago something was, put into other messages
time:
  days-ago: <amount> days ago
  hours-ago: <amount> hours ago
  minutes-ago: <amount> min ago

# Religion chat (/gods chat): <god>, <player> and the <message> they wrote
chat:
  believer: '<yellow>[<god>Chat] <red><player><yellow>: <white><message>'
  priest: '<yellow>[<god>Chat] <player>: <white><message>'
  # The <player> of believer and priest for a believer with a devotion title (config.yml devotion.chat-title and
  # devotion.unlocks.title): <title> (their devotion level, as the god type calls it) and <player>
  titled-player: '<gold><title></gold> <player>'

# PlaceholderAPI's %gods_tag%: the player's god as a ready-made tag for name tags, chat or the tab list (e.g. the TAB
# plugin's tagprefix). Nothing for players without a god. <god>, <god-color>...</god-color> (the god's color),
# <rank> (the god's rank), <devotion> (the player's devotion level) and <title> (their devotion title, or nothing)
placeholder:
  tag: '<god-color>[<god>]</god-color> '
  # For the god's priests
  tag-priest: '<god-color>[<god>]</god-color><gold>✝</gold> '

holy-book:
  # The title of a new holy book (no colors)
  default-title: Holy Book of <god>

# Holy artifacts
artifact:
  # The name stored in the artifact (no colors): <item> is one of the names below, <god> the god that gave it
  item-name: <item> of <god>
  # The name shown: <name> is item-name
  display-name: <gold><name>
  # The name once the artifact has a rank: <rank> below
  ranked-name: <rank> <gold><name>
  # Sent to everyone when an artifact gets a new rank: <player>, <name>, <rank>
  ranked: <aqua><player>'s <white><name><aqua> is now <rank>
  # The second lore line: <amount> of uses
  used: <white>Used <amount> times
  used-once: <white>Used <amount> time
  cooling-down: <red>Your holy artifact needs <seconds> more seconds to regain its power.
  world-busy: <red>The heavens of this world are already being moved by a holy artifact.
  # The ranks an artifact earns by being used (5, 20, 50, 100, 150, 200, 300, 500 and 1000 uses)
  rank:
    shiny: <green>Shiny
    honorable: <green>Honorable
    holy: <green>Holy
    saintly: <green>Saintly
    amazing: <blue>Amazing
    mega: <blue>Mega
    awesome: <blue>Awesome
    epic: <dark_purple>Epic
    legendary: <gold>Legendary
  # The third lore line: <value> is the power's strength (1, and more from gods of higher ranks), <double> twice that,
  # <radius> how far FREEZE and NATURE reach, <distance> how far TELEPORT goes, <hearts> how hard EARTHQUAKE hits
  power:
    KNOWLEDGE: <green>Boosts <value> levels of xp
    CALLMOON: <green>Calls the moon for <value> min
    CALLSUN: <green>Calls the sun for <value> min
    HEALING: <green>Heals up to <value> other players
    TAME: <green>Tame all beasts within <double> blocks
    LIGHTNING: <green>Lightning strikes up to <value> enemies
    LIGHTNING_STORM: <green>Creates a thunderstorm lasting <value> minutes
    TELEPORT: <green>Teleport up to <distance> blocks
    FREEZE: <green>Freezes all water within a <radius> block radius
    ICE: <green>Shoots ice spike which freezes a target on hit
    FIREBALL: <green>Fires a fireball with a <value> seconds cooldown
    EARTHQUAKE: <green>Earthquake that hurts for <hearts> hearts
    NATURE: <green>Grows nature in a radius of <radius> blocks
    FIREWORK: <green>Shoots <value> firework rockets
    DRUNK: <green>Gets you drunk for <value> seconds!
  # Per god type: the first lore line, and the names of its two artifact items (in the order of the items Gods picks
  # from)
  kind:
    FROST:
      lore: <dark_purple>A Holy artifact of Frost
      items: [Frostwand, Frostblade]
    LOVE:
      lore: <dark_purple>A Holy artifact of Love
      items: [Love jewel, Heartstone]
    EVIL:
      lore: <dark_purple>An Unholy artifact of Evil
      items: [Bloodsword, Bloodaxe]
    SEA:
      lore: <dark_purple>A Holy artifact of the Sea
      items: [Heart of the sea, Tidestone]
    MOON:
      lore: <dark_purple>A Holy artifact of the Moon
      items: [Moon dial, Night veil]
    SUN:
      lore: <dark_purple>A Holy artifact of the Sun
      items: [Sunstaff, Sunblade]
    THUNDER:
      lore: <dark_purple>A Holy artifact of Thunder
      items: [Thunderwand, Thunderaxe]
    PARTY:
      lore: <dark_purple>A Holy artifact of the PAAARTEY!
      items: [Partystick, Partystar]
    WAR:
      lore: <dark_purple>A Holy artifact of War
      items: [Warsword, Waraxe]
    WEREWOLVES:
      lore: <dark_purple>A Holy artifact of the Pack
      items: [Wolfpaw, Fangblade]
    CREATURES:
      lore: <dark_purple>A Holy artifact of Creatures
      items: [Beastwand, Beast feather]
    WISDOM:
      lore: <dark_purple>A Holy artifact of Wisdom
      items: [Knowledge tome, Quill]
    NATURE:
      lore: <dark_purple>A Holy artifact of Nature
      items: [Earthdigger, Druid staff]
