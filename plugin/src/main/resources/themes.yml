# Gods' own god themes. This file lives in the Gods jar and is never written to disk: to change a theme, put only
# your changes in plugins/Gods/themes.yml (Gods writes a commented example there once).
#
# Each god type has a section; "default" fills what a god type's section leaves out, and is the theme of gods without
# a type. In each:
#   holy-mobs        mobs the god forbids killing (each god picks one and keeps it)
#   unholy-mobs      mobs the god wants slain (each god picks one and keeps it)
#   holy-foods       foods the god wants eaten (each god picks one and keeps it)
#   unholy-foods     foods the god forbids (each god picks one and keeps it)
#   sacrifice-needs  items the god may come to want sacrificed (each god's seed picks five; its forbidden food may be
#                    wanted burnt too)
#   slay-targets     mobs slay quests ask for, besides the god's unholy mob
#   curse-mobs       mobs a curse sends after the cursed player (one kind per curse, picked at random)
#   peaceful-mobs    mobs the world may still spawn in the god's holy land when the god doesn't allow mob spawning
#                    (besides its holy mob; its unholy mob never spawns there); [] for none
#   altar-blocks     blocks an altar is built on to make a god of this type (config.yml's altars.block-types replaces
#                    them for the god types it lists)
#   sign             how altar signs look: messages (the texts under altar.sign.<messages> in messages.yml), dye (the
#                    sign's dye color) and glowing (glowing text)
#   ranks            what the gods' ranks are called (config.yml's ranks section): spirit, recognized, descended,
#                    exalted and greater, each a name (shown in /g info, /g list, above altars and by PlaceholderAPI)
#   devotion         what the gods' believers' devotion levels are called (config.yml's devotion section): follower,
#                    devotee, zealot and saint, each a name (shown in /g devotion, /g followers and by PlaceholderAPI)
#   effects          how the gods' effects look and sound (config.yml's effects section switches them): symbol (text that
#                    floats up at prayers), and pleased, neutral and angry, each with particles (particle ids),
#                    sounds (sound ids like block.amethyst_block.chime) and colors (dye colors or "#RRGGBB", for dust
#                    particles and the symbol). Prayers use the god's mood, sacrifices pleased (wanted), neutral or
#                    angry (unwanted), blessings pleased and curses angry.
#   npc              the god's figure at its main altar (config.yml's npc section): skin, with god, goddess and
#                    deity, each the value and signature of a texture Mojang signed. A god wears its own skin
#                    (/g godskin) first; else a god (and a god from before genders) its type's god skin, else the
#                    default section's god skin; a goddess its type's goddess skin, else the default section's;
#                    a deity its type's deity skin, its type's god skin, the default section's deity skin, else the
#                    default section's god skin. Without any, the figure has the plain look. Player names don't work
#                    here. To get a value and signature:
#                     - upload the skin's PNG to https://mineskin.org and copy the "value" and "signature" it shows;
#                     - or skip this file: wear the skin in Minecraft, have the god's priest run /g godskin <your name>
#                       while you're online (or run /g godskin yourself as the priest), and change back; the god
#                       keeps the skin.
# Names are Minecraft ids. Names the server's Minecraft version doesn't have (newer mobs and blocks) are skipped.

default:
  holy-mobs: [chicken, cow, pig, sheep, rabbit, horse, bat]
  unholy-mobs: [chicken, cow, pig, sheep, rabbit, horse, bat, wolf, skeleton, zombie]
  holy-foods: [apple, bread, cooked_salmon, melon_slice, cooked_beef, cooked_porkchop, carrot]
  unholy-foods: [apple, bread, cooked_salmon, melon_slice, cooked_beef, cooked_porkchop, carrot]
  sacrifice-needs: [poppy, cooked_porkchop, rabbit_hide, rabbit_foot, cactus, bread, carrot, iron_pickaxe, iron_ingot, gold_ingot,
    apple, book, cake, melon_slice, cookie, pumpkin, sugar_cane, egg, wheat, netherrack, potato, bone, feather]
  slay-targets: [sheep, spider, chicken, cow, pig]
  curse-mobs: [skeleton, zombie, zombified_piglin, spider, wolf]
  peaceful-mobs: [bat, squid, chicken, pig, cow, ocelot, sheep, villager, mooshroom, iron_golem]
  altar-blocks: []
  sign:
    messages: default
    dye: black
    glowing: false
  ranks:
    spirit: Spirit
    recognized: Recognized
    descended: Descended
    exalted: Exalted
    greater: Greater God
  devotion:
    follower: Follower
    devotee: Devotee
    zealot: Zealot
    saint: Saint
  effects:
    symbol: "✦"
    pleased:
      particles: [end_rod, enchant]
      sounds: [block.amethyst_block.chime]
      colors: ['#FFD700', white]
    neutral:
      particles: [enchant]
      sounds: [block.enchantment_table.use]
      colors: [white]
    angry:
      particles: [smoke, ash]
      sounds: [block.respawn_anchor.deplete]
      colors: [gray, black]
  npc:
    skin:
      # A god, from MineSkin: https://mineskin.org/skins/c66ad715479f477dae18cb0c8688d367
      god:
        value: 
        signature: 
      # A goddess (slim model), from MineSkin: https://mineskin.org/skins/23fd79ecb0354ecd9a4d89900135ba1e
      goddess:
        value: 
        signature: 
      # A deity, from MineSkin: https://mineskin.org/skins/55c07d4a3bc14c32b233e8cbe9997d61
      deity:
        value: 
        signature: 

