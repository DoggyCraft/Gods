# Gods configuration
#
# Gods never rewrites this file, so your comments and layout stay. When a newer version of Gods adds a setting, it is
# added to this file with its default. Use /g reload to apply changes without restarting.
#
# Configs from Gods 0.9.x (with CamelCase keys like Settings.Debug) are upgraded automatically on start; the old file
# is kept as config.yml.v1.bak.

# The version of this file's layout. Gods uses it to upgrade old configs; don't change it.
config-version: 5

general:
  # Log extra information to the console, for finding problems.
  debug: false
  # The language of Gods' messages: the folder in plugins/Gods/lang/ (english: lang/english/messages.yml and voices/).
  language: english
  # The name of your server, used in some messages.
  server-name: Your Server
  # The worlds Gods is active in. Leave it empty ([]) for every world, also worlds loaded later by other plugins.
  worlds: []

gods:
  # Tell everyone online when a new god is created.
  broadcast-new-gods: true
  # Whether new religions are private (invite only) until their priest opens them.
  private-by-default: false
  # Show a god's title (like "God of Frost") next to its name in /g info and /g list.
  titles: true
  # How chatty gods are. 1.0 is normal, 0.5 half as much, 2.0 twice as much.
  verbosity: 1.0
  # How fast a god's mood falls back towards neutral on each update. 0 turns it off.
  mood-falloff: 0.03
  # Only allow gods listed in whitelist.yml. When both lists are on, only the whitelist is used.
  whitelist: false
  # Never allow gods listed in blacklist.yml.
  blacklist: false

believers:
  # Players lose their religion when they die.
  leave-religion-on-death: false
  # How long a player must wait after joining a religion before they can change to another god, in seconds.
  min-seconds-between-changing-god: 300
  # Believers who haven't prayed for this many hours leave their religion.
  max-hours-without-prayer: 154

priests:
  # A god needs this many believers to choose a priest. Each further priest needs 6 more believers.
  min-believers: 3
  # The most priests a god can have.
  max-per-god: 1
  # Priests who haven't prayed for this many hours stop being priests.
  max-hours-without-prayer: 72
  # How many hours a god's priests must wait between two changes of its gender with /g gender.
  gender-change-cooldown-hours: 24
  # A console command to run when a player becomes a priest, e.g. "lp user $PlayerName parent add priest". Empty for none.
  assign-command: ""
  # A console command to run when a priest is removed, e.g. "lp user $PlayerName parent remove priest". Empty for none.
  remove-command: ""

altars:
  # An altar is a block with a light on top (a torch, lantern or candle) and a wall sign on its side. The block decides
  # the type of god it makes. Each god type's blocks come from its theme (Gods' own themes.yml, changed by
  # plugins/Gods/themes.yml), e.g. snow_block, packed_ice and blue_ice for frost; /g help blocks lists them.
  # To choose a god type's blocks here instead, list them (Minecraft ids): the list replaces the theme's blocks for that
  # type, and an empty list means no altar makes it. A block listed for several god types makes one of them at random.
  # For example:
  #   block-types:
  #     frost: [snow_block, ice]
  #     werewolves: [mossy_cobblestone]
  block-types: {}
  # With GriefPrevention installed, new altars (praying, curse and blessing signs) can only be built inside a claim
  # where the builder has build trust (the owner or trusted players). Altars that already stand keep working wherever
  # they are. Without GriefPrevention this does nothing.
  require-claim: true
  # Text floating above praying altars: the god's name and title in the style of its god type (altar.floating in
  # messages.yml). all: above every praying altar; main: only above gods' main altars (/g setaltar); off: none.
  floating-text: all
  # How far away players see the floating text, in blocks. 1 to 128 (the server's tracking range for display entities
  # may cut it shorter).
  floating-text-view-distance-blocks: 32

prayers:
  # Players can pray for things with /g pray (an item, health, a blessing or a quest), paid with prayer power.
  enabled: true
  # How long a player must wait between two prayers at an altar, in minutes.
  min-minutes-between-prayers: 30
  # The prayer power each kind of /g pray costs.
  power-cost:
    item: 20
    health: 10
    blessing: 10
    quest: 50

sacrifices:
  # Players can sacrifice items to their god by burning them.
  enabled: true

commandments:
  # Gods have holy foods and holy mobs they want eaten and killed, or forbidden.
  enabled: true
  # Tell the religion when a believer eats a holy or forbidden food.
  broadcast-food-eaten: true
  # Tell the religion when a believer kills a holy or forbidden mob.
  broadcast-mob-slain: true

blessings:
  # Priests can bless players with a blessing altar sign, and gods bless their believers.
  enabled: true
  # How long a player must wait between two blessings, in seconds.
  min-seconds-between-blessings: 600
  # How long a player stays a god's blessed player after a priest names them, in seconds.
  blessed-seconds: 180
  # The effects a blessing can give.
  effects:
    speed: true
    regeneration: true
    heal: true
    fast-digging: true
    increase-damage: true

curses:
  # Priests can curse players with a cursing altar sign.
  enabled: true
  # How long a player must wait between two curses, in seconds.
  min-seconds-between-curses: 5
  # How long a player stays a god's cursed player after a priest names them, in minutes.
  cursed-minutes: 10
  # Gods can strike cursed players with lightning.
  lightning: true
  # Gods can send hostile mobs after cursed players.
  mobs: true

item-blessings:
  # Gods give their believers items (tools, weapons, armor) when they are pleased.
  enabled: true
  # How long a player must wait between two item blessings, in minutes.
  min-minutes-between-blessings: 10
  # The god power a god needs to bless items at all.
  min-god-power: 3
  # The god power a god needs for better tools and weapons: above level 1 they are stone, above level 2 iron and
  # above level 3 diamond (wooden below that).
  god-power-for-level-1-items: 10
  god-power-for-level-2-items: 50
  god-power-for-level-3-items: 100

holy-artifacts:
  # Gods give their believers holy artifacts: weapons with divine powers.
  enabled: true
  # How long a player must wait between two holy artifacts, in minutes.
  min-minutes-between-blessings: 1440

quests:
  # Gods give their religions quests.
  enabled: false
  # How long a god waits between two quests, in minutes.
  min-minutes-between-quests: 180
  # How many believers a god needs before it gives quests.
  required-believers: 1
  # The kinds of quest gods give.
  types:
    slay: true
    sacrifice: true
    pilgrimage: true
    give-items: false
  # Quest rewards: items (Minecraft ids) and what each is worth. A completed quest gives random items worth about the
  # god's power in total. Items worth 0 are never given. If no entry is valid, these defaults are used.
  reward-values:
    nether_wart: 33
    glowstone: 50
    coal: 5
    iron_ingot: 10
    gold_ingot: 50
    diamond: 100
    player_head: 75
    enchanted_book: 75
    potion: 75
    cocoa: 30
    blaze_rod: 50
    book: 30
    compass: 50
    paper: 20
    sugar_cane: 25
    melon_seeds: 5
    pumpkin_seeds: 5
    poppy: 1
    sunflower: 1

holy-land:
  # Religions claim the land around their altars as holy land, protected from other players.
  enabled: false
  # Whether players can fight each other in a new god's holy land.
  default-pvp: false
  # Whether mobs can hurt players in a new god's holy land.
  default-mob-damage: true
  # Gods strike players who attack their believers in holy land with lightning.
  lightning: false
  # Whether players (other than ops) can use blocks in neutral land (set with /g setneutralland).
  allow-interaction-in-neutral-lands: true
  # Holy land nobody has prayed in for this many days is removed.
  delete-abandoned-after-days: 14
  # Blocks (Minecraft ids) anyone can break and use in holy land. Altar blocks can always be used.
  breakable-blocks:
    - smooth_stone

marriage:
  # Believers of the same god can marry with /g marry.
  enabled: true
  # Fireworks at weddings (only when holy artifacts are enabled too).
  wedding-fireworks: true

bibles:
  # Religions have a holy book that priests can write (/g editbible, /g setbible).
  enabled: true
  # Give a new believer a copy of their religion's holy book.
  give-on-join: false

chat:
  # Put the player's god in front of their chat messages.
  formatting: false

effects:
  # Short effects in the style of each god type (particles, sounds and floating items or symbols; see the effects
  # section of themes.yml): at prayers, sacrifices, blessings and curses. Off means no effects at all.
  enabled: true
  # Particles rising around the altar and a sound when a believer prays: brighter when the god is pleased, darker and
  # shorter when it is angry. They grow with the god's rank (see ranks): a spirit's are a flicker, its symbol floats up
  # from the descended rank on, and a greater god's are the grandest. Off: no effect at prayers at all.
  prayer: true
  # A burning sacrifice floats up, spins and shrinks (from the recognized rank on; a spirit's only flickers in the
  # fire), with an effect showing whether the god wanted it.
  sacrifice: true
  # A soft glow and chime around blessed players, a dark swirl and a low sound around cursed ones.
  blessings: true
  # Only players this close (in blocks) see and hear the effects; nothing is shown when nobody is near. 1 to 128.
  view-distance-blocks: 32

npc:
  # Once a god has risen to the descended rank (see ranks), it stands as a figure (an NPC) in front of its main altar
  # (/g setaltar), at the spot before the altar sign.
  # Right-clicking it prays to the god as praying at the altar does. Priests give it their own skin or a player's with
  # /g godskin; otherwise it wears its theme's skin for its gender (themes.yml).
  enabled: true
  # Who makes the figure: auto, builtin, citizens, fancynpcs or off. auto uses Citizens if it is installed, else
  # FancyNpcs if it is installed, else the built-in figure (a vanilla mannequin, Minecraft 1.21.9 and newer), else none.
  provider: auto

ranks:
  # A religion grows through five ranks: spirit (a new god), recognized, descended, exalted and greater. Each god type
  # has its own names for them (themes.yml). On its turn a god rises one rank when it meets every condition of the
  # next rank. Each condition is optional: leave it out, or set it to 0 or false, and it doesn't count.
  #   min-believers           believers
  #   min-power               power (the power its believers give it with their prayers; /g info shows it)
  #   requires-priest         a priest
  #   min-mood                at least this mood: angry, displeased, neutral, pleased or exalted
  #   requires-main-altar     a main altar
  #   hours-after-priest      it has had a priest for this many hours
  #   hours-at-previous-rank  it has had the rank below for this many hours
  # and what its religion has done in its whole life:
  #   min-prayers             prayers at its altars
  #   min-sacrifices          sacrifices it was pleased with (doesn't count while sacrifices are off)
  #   min-quests              completed quests (doesn't count while quests are off)
  #   min-altars              praying altars standing
  #   min-holy-land-regions   regions of holy land (doesn't count while holy land is off)
  #   min-converts            players who joined through an invitation (/g invite)
  # requires-priest and min-believers carry over to the ranks above. A god never falls because of its mood or what
  # its religion has done (an angry god just stops rising). Without a priest it falls at once below every rank that
  # needs one; with fewer believers than its rank needs for drop-grace-hours, it falls to the highest rank it still
  # has the believers for.
  # Gods from before ranks get the rank they qualify for (leaving out what their religion has done, which Gods didn't
  # count before) on their first turn.
  # How long a god may have fewer believers than its rank needs before it falls, in hours (a believer leaving for a
  # moment doesn't make it fall).
  drop-grace-hours: 24
  # A recognized religion: it has a priest and a few believers. Its holy book and quests unlock (see unlocks).
  recognized:
    requires-priest: true
    min-believers: 3
  # The god descends to its main altar: it appears there as a figure (see npc), with lightning, and tells its
  # believers. It ascends again when it falls below this rank.
  descended:
    requires-priest: true
    min-believers: 3
    hours-after-priest: 24
    min-power: 0
    min-mood: neutral
    requires-main-altar: true
  # An exalted religion: many believers who pray, sacrifice and do quests, and a pleased god. Holy artifacts,
  # alliances and wars unlock.
  exalted:
    min-believers: 10
    min-power: 50
    min-mood: pleased
    hours-at-previous-rank: 72
    min-prayers: 150
    min-sacrifices: 20
    min-quests: 2
    min-altars: 2
    min-converts: 2
  # A greater god: a great religion that has held its rank for a week. Everyone on the server hears of it; its god
  # takes a second priest and its believers feel its aura in its holy land.
  greater:
    min-believers: 20
    min-power: 150
    min-mood: pleased
    hours-at-previous-rank: 168
    min-prayers: 500
    min-sacrifices: 75
    min-quests: 6
    min-altars: 4
    min-holy-land-regions: 4
    min-converts: 5
  # The lowest rank each feature needs (spirit, recognized, descended, exalted or greater). Commands of a feature a
  # god hasn't unlocked yet say which rank it needs. The features' own switches above still apply.
  unlocks:
    # The religion's holy book (/g bible, /g editbible, /g setbible, and a copy for new believers).
    bibles: recognized
    # Quests, given by the god or prayed for with /g prayfor quest.
    quests: recognized
    # Holy artifacts, given by the god or with /g holyartifact.
    holy-artifacts: exalted
    # Alliances and wars with other religions (/g ally, /g war).
    relations: exalted
    # One more priest than priests.max-per-god.
    extra-priest: greater
    # The aura in the god's holy land (see aura).
    aura: greater
    # Regions of holy land a god may claim on top of the ones its power gives it (power / 10 + 3), per rank.
    holy-land-extra-regions:
      spirit: 0
      recognized: 1
      descended: 2
      exalted: 4
      greater: 8
  # Believers in their own god's holy land feel its aura: a gentle effect, given again on each of the god's turns
  # (every 10 seconds or more, depending on how many gods have believers online).
  aura:
    # Whether there is an aura at all.
    enabled: true
    # The effect (a Minecraft effect id like regeneration, speed or luck).
    effect: regeneration
    # Its level: 0 for I, 1 for II.
    amplifier: 0
    # How long it lasts each time it is given, in seconds.
    seconds: 15

devotion:
  # Believers grow in devotion to their god: follower (every believer), devotee, zealot and saint. Each god type has
  # its own names for the levels (themes.yml). Believers earn devotion points by serving their god (points) and rise a
  # level as soon as they have the points it needs (levels); each level unlocks something (unlocks). Devotion fades
  # when a believer stops praying, but a level is only lost after real neglect (keep-level-percent).
  # /g devotion shows a believer's level and how to earn more.
  # Believers from before devotion start with 10 points per prayer to their god (prayers.min-minutes-between-prayers
  # apart), at most what a zealot needs, so saints are always earned.
  # Off: nobody earns devotion, nothing needs a level (holy artifacts are for every believer) and no level gives more.
  enabled: true
  # The devotion points each deed earns.
  points:
    # A prayer at an altar (at most one every prayers.min-minutes-between-prayers).
    prayer: 10
    # A sacrifice the god wanted.
    sacrifice: 15
    # Taking part in a completed quest: the believers who counted for it (the slayers, the sacrificers, the pilgrim),
    # or, for a quest that doesn't know who did it, every believer online who shares its rewards.
    quest: 40
    # Inviting a player (/g invite) who then joins.
    convert: 30
    # Eating the god's holy food (see commandment-cooldown-minutes).
    holy-food: 5
    # Slaying the god's unholy mob (see commandment-cooldown-minutes).
    unholy-mob: 5
  # Eating the holy food and slaying the unholy mob earn points at most once in this many minutes per believer.
  commandment-cooldown-minutes: 10
  # The devotion points each level needs (a follower is every believer). With a prayer every few hours, a believer is
  # a devotee after a few days and a zealot after about two weeks; a saint takes weeks of prayers, sacrifices and quests.
  levels:
    devotee: 150
    zealot: 600
    saint: 2000
  # A believer's devotion starts to fade after this many days without a prayer.
  fade-after-days: 3
  # Then it loses this many percent of its points each day until they pray again. 0: devotion never fades.
  fade-percent-per-day: 5
  # A believer keeps their level until their points fall below this percent of what the level needs, so only real
  # neglect costs a level (a saint at 2000 points loses the level about nine days after their last prayer). 100: as
  # soon as they have fewer points than it needs.
  keep-level-percent: 75
  # The percent of their points a believer keeps when they leave their god or change to another. 0: they start over.
  kept-on-changing-god-percent: 0
  # The lowest level each unlock needs (follower, devotee, zealot or saint).
  unlocks:
    # /g prayfor costs less (prayfor-discount-percent).
    prayfor-discount: devotee
    # The god may give the believer a holy artifact (its own gifts and /g holyartifact).
    holy-artifacts: zealot
    # The god's blessings (effects, items, healing, holy artifacts) come more often (blessing-chance-multiplier).
    more-blessings: zealot
    # The god now and then praises the believer by name to its other believers.
    praise: saint
    # The level's name becomes the believer's title: %gods_devotion_title% and, with chat-title, religion chat.
    title: saint
    # The god prefers the believer when it chooses a priest, and asks them on its next turn.
    priesthood: saint
  # How much less /g prayfor costs from unlocks.prayfor-discount on, in percent.
  prayfor-discount-percent: 25
  # How many times as likely the god's blessings are from unlocks.more-blessings on. 1 to 10.
  blessing-chance-multiplier: 2
  # Show the believer's title (unlocks.title) before their name in religion chat (/g chat).
  chat-title: true
