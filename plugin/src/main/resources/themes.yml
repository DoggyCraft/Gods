  unholy-foods: [baked_potato, cooked_porkchop, pumpkin_pie, melon_slice, cooked_beef, bread]
  sacrifice-needs: [snowball, packed_ice, blue_ice, powder_snow_bucket, leather, rabbit_hide, rabbit_foot, cod, salmon,
    sweet_berries, spruce_log, white_wool, feather, bone, iron_ingot, goat_horn]
  slay-targets: [stray, zombie, skeleton, spider, creeper, husk]
  altar-blocks: [snow_block, packed_ice, blue_ice]
  sign:
    messages: frost
    dye: light_blue
    glowing: true

