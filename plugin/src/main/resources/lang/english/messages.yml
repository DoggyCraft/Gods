# The messages of Gods, in MiniMessage: https://docs.advntr.dev/minimessage/format.html
#
# A message can be one line, a list of lines, or '' to send nothing. Every message knows <server> (general.server-name
# in config.yml) and <hl>...</hl>, the gold highlight Gods uses for names and numbers; the other tags a message knows
# are listed next to it or its section. A message missing here falls back to the one bundled with Gods.
#
# What the gods themselves say is in voices/<type>_<gender>.yml.
messages-version: 2

god:
  # How a god's words look: speech for words to one player (a prayer answered, a blessing, a question; like a private
  # message), speech-believers for words to the whole religion, its believers or priests (a new believer, a quest, a
  # new rank; like a channel). Style them apart to tell them apart. <god> is the god's name, <message> the line from
  # its voice file, <player> the player who hears it and <gender> the god's gender (God, Goddess, Deity).
  speech: '<gold>\<<god>>: <white><bold><message>'
  speech-believers: '<gold>\<<god>>: <white><bold><message>'
  question-hint: <aqua>Use <white>/gods yes or /gods no</white> to answer the God
  # <player> in what a god says at random when it has no priest
  our-priest: our priest

# Hints sent a little while after something happens
help:
  commands-hint: <aqua>Use <white>/g help</white> for a list of commands
  altar-hint: <aqua>Use <white>/g help altar</white> for info about how to build an altar
  prayfor-hint: <aqua>Use <white>/g prayfor</white> for info about spending your prayer power
  info-hint: <aqua>Use <white>/g info \<godname></white> to see information about a God

altar:
  # <god>
  other-god: <dark_red>You cannot build altars to other Gods
  no-access: <dark_red>You do not have access to that religion
  # <god>
  pray-hint: <aqua>Right click the sign on the altar, the altar block or its light to pray to your god.
  god-not-allowed: <dark_red>You cannot pray to a God with such a name
  praying-not-allowed: <dark_red>You do not have permission to pray at altars
  invalid-god-name: <dark_red>That is not a proper name for a God!
  invalid-sign: <dark_red>Only write the name of a God on the sign
  # The words a player may write on a new altar sign, on another line than the God's name, to choose the God's gender
  # (any case); /gods gender takes them too. English "God", "Goddess" and "Deity" always work. Without one, a new God
  # chooses its gender itself.
  gender-words:
    male: [God]
    female: [Goddess]
    non-binary: [Deity]
  blessing-hint: <aqua>Right click the sign on the altar to bless that player
  curse-hint: <aqua>Right click the sign on the altar to curse that player
  curse-not-allowed: <dark_red>You cannot curse players
  blessing-not-allowed: <dark_red>You cannot bless players
  build-not-allowed: <dark_red>You cannot build altars
  # With GriefPrevention, new altars only stand in a claim where the builder has build trust
  not-in-claim: <dark_red>Altars can only be built in a claim where you may build
  create-god-not-allowed: <red>You cannot create a new God
  # The front text Gods writes on altar signs: four lines each, per sign style (sign.messages of a god type's theme in
  # themes.yml; a style without its own text uses default). praying knows <god>, <gender> ("God", "Goddess", "Deity")
  # and <title> ("Deity of the Sea"); curses and blessings know <player>.
  # Altar signs are recognized by their tags, not by this text, so it can say anything.
  sign:
    default:
      praying: [Altar, of, <god>, '']
      curses: [Curses, 'On', <player>, '']
      blessings: [Blessings, 'On', <player>, '']
    frost:
      praying: ['<aqua>❄ Altar ❄', '<dark_aqua>of the frost', '<white><god>', '']
      curses: ['<dark_aqua>❄ Curses ❄', '<aqua>freeze', '<white><player>', '']
      blessings: ['<aqua>❄ Blessings ❄', '<dark_aqua>upon', '<white><player>', '']
    love:
      praying: ['<light_purple>♥ Altar ♥', '<#ff8ac8>of love', '<white><god>', '']
      curses: ['<dark_purple>♥ Curses ♥', '<light_purple>upon', '<white><player>', '']
      blessings: ['<light_purple>♥ Blessings ♥', '<#ff8ac8>upon', '<white><player>', '']
    evil:
      praying: ['<dark_red>☠ Altar ☠', '<gray>of darkness', '<red><god>', '']
      curses: ['<dark_red>☠ Curses ☠', '<gray>upon', '<red><player>', '']
      blessings: ['<dark_purple>Dark Blessings', '<gray>upon', '<red><player>', '']
    sea:
      praying: ['<aqua>≈ Altar ≈', '<dark_aqua>of the deep', '<white><god>', '']
      curses: ['<dark_aqua>≈ Curses ≈', '<aqua>drown', '<white><player>', '']
      blessings: ['<aqua>≈ Blessings ≈', '<dark_aqua>upon', '<white><player>', '']
    moon:
      praying: ['<gray>☾ Altar ☾', '<dark_gray>of the night', '<white><god>', '']
      curses: ['<dark_gray>☾ Curses ☾', '<gray>upon', '<white><player>', '']
      blessings: ['<gray>☾ Blessings ☾', '<dark_gray>upon', '<white><player>', '']
    sun:
      praying: ['<gold>☀ Altar ☀', '<yellow>of the sun', '<white><god>', '']
      curses: ['<red>☀ Curses ☀', '<gold>burn', '<white><player>', '']
      blessings: ['<gold>☀ Blessings ☀', '<yellow>upon', '<white><player>', '']
    thunder:
      praying: ['<yellow>⚡ Altar ⚡', '<gold>of the storm', '<white><god>', '']
      curses: ['<gold>⚡ Curses ⚡', '<yellow>strike', '<white><player>', '']
      blessings: ['<yellow>⚡ Blessings ⚡', '<gold>upon', '<white><player>', '']
    party:
      praying: ['<light_purple>♪ Altar ♪', '<green>of the feast', '<yellow><god>', '']
      curses: ['<dark_purple>♪ Curses ♪', '<green>upon', '<yellow><player>', '']
      blessings: ['<light_purple>♪ Blessings ♪', '<green>upon', '<yellow><player>', '']
    war:
      praying: ['<red>⚔ Altar ⚔', '<gray>of war', '<white><god>', '']
      curses: ['<dark_red>⚔ Curses ⚔', '<gray>upon', '<white><player>', '']
      blessings: ['<red>⚔ Blessings ⚔', '<gray>upon', '<white><player>', '']
    werewolves:
      praying: ['<gray>☾ Altar ☾', '<dark_gray>of the pack', '<white><god>', '']
      curses: ['<dark_gray>Curses', '<gray>of the pack on', '<white><player>', '']
      blessings: ['<gray>Blessings', '<dark_gray>of the pack on', '<white><player>', '']
    creatures:
      praying: ['<gold>✦ Altar ✦', '<dark_green>of creatures', '<white><god>', '']
      curses: ['<dark_green>✦ Curses ✦', '<gold>upon', '<white><player>', '']
      blessings: ['<gold>✦ Blessings ✦', '<dark_green>upon', '<white><player>', '']
    wisdom:
      praying: ['<blue>✎ Altar ✎', '<dark_aqua>of wisdom', '<white><god>', '']
      curses: ['<dark_blue>✎ Curses ✎', '<blue>upon', '<white><player>', '']
      blessings: ['<blue>✎ Blessings ✎', '<dark_aqua>upon', '<white><player>', '']
    nature:
      praying: ['<green>✿ Altar ✿', '<dark_green>of nature', '<white><god>', '']
      curses: ['<dark_green>✿ Curses ✿', '<green>upon', '<white><player>', '']
      blessings: ['<green>✿ Blessings ✿', '<dark_green>upon', '<white><player>', '']
  # The text floating above praying altars (config.yml's altars.floating-text), per sign style like the signs above (a
  # style without its own text uses default): altar above every praying altar, main above a god's main altar
  # (/gods setaltar). One entry per line; blank lines are left out. Knows <god>, <title> ("Deity of the Sea"; empty
  # when gods.titles is off), <gender> ("God", "Goddess", "Deity"), <mood> (names.mood), <believers> (how many) and
  # <rank> (the god's rank, as its god type calls it in themes.yml).
  floating:
    default:
      altar: ['<white><bold><god>', '<gray><title>']
      main: ['<white><bold><god>', '<gray><title>', '<gold>✦ Main altar · <rank> ✦']
    frost:
      altar: ['<aqua>❄ <white><bold><god></bold> <aqua>❄', '<dark_aqua><title>']
      main: ['<aqua>❄ <white><bold><god></bold> <aqua>❄', '<dark_aqua><title>', '<aqua>Main altar · <rank>']
    love:
      altar: ['<light_purple>♥ <white><bold><god></bold> <light_purple>♥', '<#ff8ac8><title>']
      main: ['<light_purple>♥ <white><bold><god></bold> <light_purple>♥', '<#ff8ac8><title>', '<light_purple>Main altar · <rank>']
    evil:
      altar: ['<dark_red>☠ <red><bold><god></bold> <dark_red>☠', '<gray><title>']
      main: ['<dark_red>☠ <red><bold><god></bold> <dark_red>☠', '<gray><title>', '<dark_red>Main altar · <rank>']
    sea:
      altar: ['<aqua>≈ <white><bold><god></bold> <aqua>≈', '<dark_aqua><title>']
      main: ['<aqua>≈ <white><bold><god></bold> <aqua>≈', '<dark_aqua><title>', '<aqua>Main altar · <rank>']
    moon:
      altar: ['<gray>☾ <white><bold><god></bold> <gray>☾', '<dark_gray><title>']
      main: ['<gray>☾ <white><bold><god></bold> <gray>☾', '<dark_gray><title>', '<gray>Main altar · <rank>']
    sun:
      altar: ['<gold>☀ <white><bold><god></bold> <gold>☀', '<yellow><title>']
      main: ['<gold>☀ <white><bold><god></bold> <gold>☀', '<yellow><title>', '<gold>Main altar · <rank>']
    thunder:
      altar: ['<yellow>⚡ <white><bold><god></bold> <yellow>⚡', '<gold><title>']
      main: ['<yellow>⚡ <white><bold><god></bold> <yellow>⚡', '<gold><title>', '<yellow>Main altar · <rank>']
    party:
      altar: ['<light_purple>♪ <yellow><bold><god></bold> <light_purple>♪', '<green><title>']
      main: ['<light_purple>♪ <yellow><bold><god></bold> <light_purple>♪', '<green><title>', '<light_purple>Main altar · <rank>']
    war:
      altar: ['<red>⚔ <white><bold><god></bold> <red>⚔', '<gray><title>']
      main: ['<red>⚔ <white><bold><god></bold> <red>⚔', '<gray><title>', '<red>Main altar · <rank>']
    werewolves:
      altar: ['<gray>☾ <white><bold><god></bold> <gray>☾', '<dark_gray><title>']
      main: ['<gray>☾ <white><bold><god></bold> <gray>☾', '<dark_gray><title>', '<gray>Main altar · <rank>']
    creatures:
      altar: ['<gold>✦ <white><bold><god></bold> <gold>✦', '<dark_green><title>']
      main: ['<gold>✦ <white><bold><god></bold> <gold>✦', '<dark_green><title>', '<gold>Main altar · <rank>']
    wisdom:
      altar: ['<blue>✎ <white><bold><god></bold> <blue>✎', '<dark_aqua><title>']
      main: ['<blue>✎ <white><bold><god></bold> <blue>✎', '<dark_aqua><title>', '<blue>Main altar · <rank>']
    nature:
      altar: ['<green>✿ <white><bold><god></bold> <green>✿', '<dark_green><title>']
      main: ['<green>✿ <white><bold><god></bold> <green>✿', '<dark_green><title>', '<green>Main altar · <rank>']

prayer:
  power: <aqua>Your prayer power is now <hl><amount></hl>
  left-religion: <red>You left the religion of <hl><god></hl>
  confirm-change: <yellow>By praying to this God you will LEAVE the religion of <hl><god></hl>! Click again to confirm this action.
  change-too-soon: <red>You cannot change god so soon! Try again later.
  too-soon: <red>You cannot pray at an altar so soon! Gather your strength and try again in <hl><minutes></hl> minutes.
  rejected-invitation: <red>You rejected the offer to join <hl><god></hl>!
  # <amount> is the prayer power missing, <god>
  not-enough-power: <aqua>You need <hl><amount></hl> more prayer power for that
  # <amount> is the prayer power it costs, <god>
  prayed-for-blessing: <aqua>You prayed to <hl><god></hl> for a blessing!
  prayed-for-item: <aqua>You prayed to <hl><god></hl> for an item!
  prayed-for-health: <aqua>You prayed to <hl><god></hl> for good health!
  prayed-for-quest: <aqua>You prayed to <hl><god></hl> for a quest!

priest:
  invite-hint: <aqua>Use /g invite to invite a player to your religion!
  followers-hint: <aqua>Use /g followers to keep track of your followers!
  description-hint: <aqua>Use /g desc to set a description for your religion!

believer:
  # <amount> is the power earned, <god>
  power-for-heathen-kill: <aqua>You earned <hl><amount></hl> power by slaying a non-believer in the name of <hl><god></hl>!
  power-for-enemy-kill: <aqua>You earned <hl><amount></hl> power by slaying an enemy of <hl><god></hl>!

holy-land:
  # Titles on the screen when entering land; a title and its subtitle
  title:
    wilderness: <dark_green>Wilderness
    wilderness-subtitle: ''
    neutral: <white>Neutral Land
    neutral-subtitle: <green>You are safe against mobs and PvP
    # <god> owning the land
    holy-land: <gold>Holyland of <god>
    # The subtitle in your own holy land: <description> of your god
    description: <white><description>
    # The subtitle in a named holy land of another god: its <name>
    holy-land-name: <white><name>
    # The subtitle in a holy land of another god: its god's <description>
    other-description: <description>
    contested: <gold>Holyland of <god>
    # <minutes> left of the battle
    contested-subtitle: <red>Contested <minutes> min
  size: <aqua>You religion now has claimed <hl><claimed></hl>/<hl><max></hl> Holyland
  cannot-claim-more: <red>You cannot claim more Holyland
  attack-hint: <aqua>Stand in the Holy Land of an enemy religion and use <white>/gods startattack</white> to attack it!
  attacking-hint: <aqua>Your religion is attacking an enemy Holy Land! Use /g attack to join the battle!
  # <minutes> left of the battle
  contested-kills: <aqua>The attackers need <hl><attacker_kills></hl> kills and the defenders need <hl><defender_kills></hl> kills to win this Holy Land
  # <god> owning the land
  contested-desecration: <aqua>This Holy Land has been desecrated <hl><desecrations></hl> times
  no-teleport: <dark_red>You cannot teleport into the Holy Land of <hl><god></hl>
  neutral-no-build: <red>You cannot build in neutral land
  neutral-no-break: <red>You cannot break blocks in neutral land
  no-access: <red>You do not have access to the holy land of <yellow><god>
  # The same, when using or attacking something in it
  no-access-gold: <red>You do not have access to the holy land of <gold><god>
  contested-no-access: <red>This Holy Land is contested! Win the battle before you can access this Holy Land!

marriage:
  # <player> in what a god says about a married couple
  couple: <first> and <second>
  # <player> is the partner's display name
  divorced-you: <red><hl><player></hl> just <hl>DIVORCED</hl> you!
  loves-you: <green><hl><player></hl> <dark_red>LOVES</dark_red> you!

quest:
  sacrifice-hint: <aqua>Sacrifice items to your God by burning them
  target-range: <aqua>You are <hl><distance></hl> blocks from the quest target
  target-hint: <aqua>Use /g hunt to hunt for the quest target!

power:
  healed: <aqua>You healed <hl><amount></hl> beings

